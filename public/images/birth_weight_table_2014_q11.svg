<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="480" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="720" height="440" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Exam Header Badge -->
  <rect x="40" y="38" width="680" height="46" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
  <text x="56" y="60" font-size="12" font-weight="800" fill="#0f766e" letter-spacing="1">PART IV FINAL M.B., B.S. EXAMINATION — AUGUST 2014</text>
  <text x="56" y="74" font-size="11" font-weight="600" fill="#115e59">COMMUNITY MEDICINE • BIOSTATISTICS SECTION II (QUESTION 11)</text>

  <!-- Question Title -->
  <text x="40" y="112" font-size="15" font-weight="800" fill="#0f172a">QUESTION 11: Term Infant Birth Weights Comparison (Males vs. Females)</text>
  <text x="40" y="132" font-size="12" font-style="italic" fill="#475569">
    "Given sample data comparing birth weights of 10 male and 10 female infants delivered at term in a maternity center:"
  </text>

  <!-- Table Container -->
  <g transform="translate(40, 150)">
    <!-- Header Row -->
    <rect x="0" y="0" width="680" height="34" fill="#0f766e" rx="6"/>
    <text x="24" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">INFANT NO.</text>
    <text x="230" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">MALE BIRTH WEIGHT (kg)</text>
    <text x="480" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">FEMALE BIRTH WEIGHT (kg)</text>

    <!-- Rows 1 to 10 -->
    <!-- Row 1 -->
    <rect x="0" y="34" width="680" height="20" fill="#f8fafc"/>
    <text x="24" y="48" font-size="10" font-weight="600" fill="#0f172a">Infant 1</text>
    <text x="280" y="48" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.4</text>
    <text x="530" y="48" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.1</text>

    <!-- Row 2 -->
    <rect x="0" y="54" width="680" height="20" fill="#ffffff"/>
    <text x="24" y="68" font-size="10" font-weight="600" fill="#0f172a">Infant 2</text>
    <text x="280" y="68" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.6</text>
    <text x="530" y="68" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.3</text>

    <!-- Row 3 -->
    <rect x="0" y="74" width="680" height="20" fill="#f8fafc"/>
    <text x="24" y="88" font-size="10" font-weight="600" fill="#0f172a">Infant 3</text>
    <text x="280" y="88" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.1</text>
    <text x="530" y="88" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">2.9</text>

    <!-- Row 4 -->
    <rect x="0" y="94" width="680" height="20" fill="#ffffff"/>
    <text x="24" y="108" font-size="10" font-weight="600" fill="#0f172a">Infant 4</text>
    <text x="280" y="108" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.8</text>
    <text x="530" y="108" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.4</text>

    <!-- Row 5 -->
    <rect x="0" y="114" width="680" height="20" fill="#f8fafc"/>
    <text x="24" y="128" font-size="10" font-weight="600" fill="#0f172a">Infant 5</text>
    <text x="280" y="128" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.5</text>
    <text x="530" y="128" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.2</text>

    <!-- Row 6 -->
    <rect x="0" y="134" width="680" height="20" fill="#ffffff"/>
    <text x="24" y="148" font-size="10" font-weight="600" fill="#0f172a">Infant 6</text>
    <text x="280" y="148" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.3</text>
    <text x="530" y="148" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.0</text>

    <!-- Row 7 -->
    <rect x="0" y="154" width="680" height="20" fill="#f8fafc"/>
    <text x="24" y="168" font-size="10" font-weight="600" fill="#0f172a">Infant 7</text>
    <text x="280" y="168" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.7</text>
    <text x="530" y="168" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.5</text>

    <!-- Row 8 -->
    <rect x="0" y="174" width="680" height="20" fill="#ffffff"/>
    <text x="24" y="188" font-size="10" font-weight="600" fill="#0f172a">Infant 8</text>
    <text x="280" y="188" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.2</text>
    <text x="530" y="188" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.1</text>

    <!-- Row 9 -->
    <rect x="0" y="194" width="680" height="20" fill="#f8fafc"/>
    <text x="24" y="208" font-size="10" font-weight="600" fill="#0f172a">Infant 9</text>
    <text x="280" y="208" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.9</text>
    <text x="530" y="208" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.3</text>

    <!-- Row 10 -->
    <rect x="0" y="214" width="680" height="20" fill="#ffffff"/>
    <text x="24" y="228" font-size="10" font-weight="600" fill="#0f172a">Infant 10</text>
    <text x="280" y="228" font-size="10.5" font-family="monospace" font-weight="700" fill="#0284c7">3.5</text>
    <text x="530" y="228" font-size="10.5" font-family="monospace" font-weight="700" fill="#e11d48">3.2</text>

    <!-- Separator Line -->
    <line x1="0" y1="238" x2="680" y2="238" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Question Instruction Footer (No Calculations) -->
  <rect x="40" y="420" width="680" height="28" fill="#f1f5f9" rx="4"/>
  <text x="50" y="438" font-size="10.5" font-weight="700" fill="#334155">
    REQUIRED: a. Calculate mean &amp; SD for each group. b. Use Student's t-test at α = 0.05 to test for significant difference.
  </text>
</svg>
