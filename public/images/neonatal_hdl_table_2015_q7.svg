<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="480" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="720" height="440" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Exam Header Badge -->
  <rect x="40" y="38" width="680" height="46" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
  <text x="56" y="60" font-size="12" font-weight="800" fill="#0f766e" letter-spacing="1">PART IV FINAL M.B., B.S. EXAMINATION — OCTOBER 2015</text>
  <text x="56" y="74" font-size="11" font-weight="600" fill="#115e59">COMMUNITY MEDICINE • BIOSTATISTICS &amp; EPIDEMIOLOGY (QUESTION 7)</text>

  <!-- Question Title -->
  <text x="40" y="112" font-size="15" font-weight="800" fill="#0f172a">QUESTION 7: Neonatal Serum HDL Cholesterol Observations (N = 10)</text>
  <text x="40" y="132" font-size="12" font-style="italic" fill="#475569">
    "The serum HDL (in mmol/L) for 10 neonates in a region is recorded in the observation table below:"
  </text>

  <!-- Table Container (Two Columns or Clean Presentation) -->
  <g transform="translate(40, 150)">
    <!-- Header Row -->
    <rect x="0" y="0" width="680" height="34" fill="#0f766e" rx="6"/>
    <text x="40" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">NEONATE SPECIMEN ID</text>
    <text x="420" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">SERUM HDL CHOLESTEROL (mmol/L)</text>

    <!-- Rows 1 to 10 -->
    <!-- Row 1 -->
    <rect x="0" y="34" width="680" height="20" fill="#f8fafc"/>
    <text x="40" y="48" font-size="10" font-weight="600" fill="#0f172a">Neonate 1</text>
    <text x="440" y="48" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.12</text>

    <!-- Row 2 -->
    <rect x="0" y="54" width="680" height="20" fill="#ffffff"/>
    <text x="40" y="68" font-size="10" font-weight="600" fill="#0f172a">Neonate 2</text>
    <text x="440" y="68" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.25</text>

    <!-- Row 3 -->
    <rect x="0" y="74" width="680" height="20" fill="#f8fafc"/>
    <text x="40" y="88" font-size="10" font-weight="600" fill="#0f172a">Neonate 3</text>
    <text x="440" y="88" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.46</text>

    <!-- Row 4 -->
    <rect x="0" y="94" width="680" height="20" fill="#ffffff"/>
    <text x="40" y="108" font-size="10" font-weight="600" fill="#0f172a">Neonate 4</text>
    <text x="440" y="108" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.58</text>

    <!-- Row 5 -->
    <rect x="0" y="114" width="680" height="20" fill="#f8fafc"/>
    <text x="40" y="128" font-size="10" font-weight="600" fill="#0f172a">Neonate 5</text>
    <text x="440" y="128" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.67</text>

    <!-- Row 6 -->
    <rect x="0" y="134" width="680" height="20" fill="#ffffff"/>
    <text x="40" y="148" font-size="10" font-weight="600" fill="#0f172a">Neonate 6</text>
    <text x="440" y="148" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.36</text>

    <!-- Row 7 -->
    <rect x="0" y="154" width="680" height="20" fill="#f8fafc"/>
    <text x="40" y="168" font-size="10" font-weight="600" fill="#0f172a">Neonate 7</text>
    <text x="440" y="168" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.68</text>

    <!-- Row 8 -->
    <rect x="0" y="174" width="680" height="20" fill="#ffffff"/>
    <text x="40" y="188" font-size="10" font-weight="600" fill="#0f172a">Neonate 8</text>
    <text x="440" y="188" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.46</text>

    <!-- Row 9 -->
    <rect x="0" y="194" width="680" height="20" fill="#f8fafc"/>
    <text x="40" y="208" font-size="10" font-weight="600" fill="#0f172a">Neonate 9</text>
    <text x="440" y="208" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.62</text>

    <!-- Row 10 -->
    <rect x="0" y="214" width="680" height="20" fill="#ffffff"/>
    <text x="40" y="228" font-size="10" font-weight="600" fill="#0f172a">Neonate 10</text>
    <text x="440" y="228" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">1.48</text>

    <!-- Separator Line -->
    <line x1="0" y1="238" x2="680" y2="238" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Question Instruction Footer (No Calculations) -->
  <rect x="40" y="420" width="680" height="28" fill="#f1f5f9" rx="4"/>
  <text x="50" y="438" font-size="10.5" font-weight="700" fill="#334155">
    REQUIRED: Calculate sample mean, standard error of the mean (SEM), and 95% confidence interval for neonatal serum HDL.
  </text>
</svg>
