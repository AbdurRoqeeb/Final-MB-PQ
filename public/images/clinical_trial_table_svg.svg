<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="480" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="720" height="440" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Exam Header Badge -->
  <rect x="40" y="38" width="680" height="46" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
  <text x="56" y="60" font-size="12" font-weight="800" fill="#0f766e" letter-spacing="1">PART IV FINAL M.B., B.S. EXAMINATION — DECEMBER 2017</text>
  <text x="56" y="74" font-size="11" font-weight="600" fill="#115e59">COMMUNITY MEDICINE &amp; PUBLIC HEALTH • BIOSTATISTICS SECTION</text>

  <!-- Question Title -->
  <text x="40" y="112" font-size="15" font-weight="800" fill="#0f172a">QUESTION 11: Clinical Trial Observation Table</text>
  <text x="40" y="132" font-size="12" font-style="italic" fill="#475569">
    "In a small clinical trial to assess the value of a new tranquilizer on psychoneurotic patients, each patient was
  </text>
  <text x="40" y="148" font-size="12" font-style="italic" fill="#475569">
    given a week's treatment with the drug and a week's treatment with a placebo. The observations were recorded as follows:"
  </text>

  <!-- Table Container -->
  <g transform="translate(40, 168)">
    <!-- Header Row -->
    <rect x="0" y="0" width="680" height="34" fill="#0f766e" rx="6"/>
    <text x="24" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">PATIENT NO.</text>
    <text x="250" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="center">PLACEBO (WEEK 1)</text>
    <text x="480" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="center">NEW TRANQUILIZER (WEEK 2)</text>

    <!-- Rows 1 to 9 -->
    <!-- Row 1 -->
    <rect x="0" y="34" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="50" font-size="11" font-weight="600" fill="#0f172a">Patient 1</text>
    <text x="290" y="50" font-size="11" font-family="monospace" font-weight="700" fill="#334155">18</text>
    <text x="540" y="50" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">22</text>

    <!-- Row 2 -->
    <rect x="0" y="58" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="74" font-size="11" font-weight="600" fill="#0f172a">Patient 2</text>
    <text x="290" y="74" font-size="11" font-family="monospace" font-weight="700" fill="#334155">21</text>
    <text x="540" y="74" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">24</text>

    <!-- Row 3 -->
    <rect x="0" y="82" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="98" font-size="11" font-weight="600" fill="#0f172a">Patient 3</text>
    <text x="290" y="98" font-size="11" font-family="monospace" font-weight="700" fill="#334155">16</text>
    <text x="540" y="98" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">21</text>

    <!-- Row 4 -->
    <rect x="0" y="106" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="122" font-size="11" font-weight="600" fill="#0f172a">Patient 4</text>
    <text x="290" y="122" font-size="11" font-family="monospace" font-weight="700" fill="#334155">22</text>
    <text x="540" y="122" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">22</text>

    <!-- Row 5 -->
    <rect x="0" y="130" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="146" font-size="11" font-weight="600" fill="#0f172a">Patient 5</text>
    <text x="290" y="146" font-size="11" font-family="monospace" font-weight="700" fill="#334155">19</text>
    <text x="540" y="146" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">25</text>

    <!-- Row 6 -->
    <rect x="0" y="154" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="170" font-size="11" font-weight="600" fill="#0f172a">Patient 6</text>
    <text x="290" y="170" font-size="11" font-family="monospace" font-weight="700" fill="#334155">17</text>
    <text x="540" y="170" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">20</text>

    <!-- Row 7 -->
    <rect x="0" y="178" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="194" font-size="11" font-weight="600" fill="#0f172a">Patient 7</text>
    <text x="290" y="194" font-size="11" font-family="monospace" font-weight="700" fill="#334155">15</text>
    <text x="540" y="194" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">19</text>

    <!-- Row 8 -->
    <rect x="0" y="202" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="218" font-size="11" font-weight="600" fill="#0f172a">Patient 8</text>
    <text x="290" y="218" font-size="11" font-family="monospace" font-weight="700" fill="#334155">20</text>
    <text x="540" y="218" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">25</text>

    <!-- Row 9 -->
    <rect x="0" y="226" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="242" font-size="11" font-weight="600" fill="#0f172a">Patient 9</text>
    <text x="290" y="242" font-size="11" font-family="monospace" font-weight="700" fill="#334155">18</text>
    <text x="540" y="242" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">20</text>

    <!-- Separator Line -->
    <line x1="0" y1="250" x2="680" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Question Prompt Instruction Footer -->
  <rect x="40" y="428" width="680" height="24" fill="#f1f5f9" rx="4"/>
  <text x="50" y="444" font-size="10.5" font-weight="700" fill="#334155">
    REQUIRED: Calculate the paired t-test value to determine whether the difference is statistically significant at α = 0.05.
  </text>
</svg>
