<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="auto" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="480" fill="#f8fafc" rx="16"/>
  <rect x="20" y="20" width="720" height="440" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Exam Header Badge -->
  <rect x="40" y="38" width="680" height="46" rx="8" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
  <text x="56" y="60" font-size="12" font-weight="800" fill="#0f766e" letter-spacing="1">PART IV FINAL M.B., B.S. EXAMINATION — 2016</text>
  <text x="56" y="74" font-size="11" font-weight="600" fill="#115e59">COMMUNITY MEDICINE &amp; PUBLIC HEALTH • BIOSTATISTICS (PAPER II)</text>

  <!-- Question Title -->
  <text x="40" y="112" font-size="15" font-weight="800" fill="#0f172a">QUESTION 12 (b): Sphygmomanometer Comparative Trial Table</text>
  <text x="40" y="132" font-size="12" font-style="italic" fill="#475569">
    "In comparing the accuracy of a digital and mercury-in-glass sphygmomanometer across 9 patients, test whether
  </text>
  <text x="40" y="148" font-size="12" font-style="italic" fill="#475569">
    there is a statistically significant difference at 0.05 and 0.01 levels of significance. The blood pressure readings (mmHg) are:"
  </text>

  <!-- Table Container -->
  <g transform="translate(40, 168)">
    <!-- Header Row -->
    <rect x="0" y="0" width="680" height="34" fill="#0f766e" rx="6"/>
    <text x="24" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">PATIENT NO.</text>
    <text x="240" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">MERCURY SPHYGMOMANOMETER (mmHg)</text>
    <text x="490" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">DIGITAL SPHYGMOMANOMETER (mmHg)</text>

    <!-- Rows 1 to 9 -->
    <!-- Row 1 -->
    <rect x="0" y="34" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="50" font-size="11" font-weight="600" fill="#0f172a">Patient 1</text>
    <text x="280" y="50" font-size="11" font-family="monospace" font-weight="700" fill="#334155">120</text>
    <text x="530" y="50" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">124</text>

    <!-- Row 2 -->
    <rect x="0" y="58" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="74" font-size="11" font-weight="600" fill="#0f172a">Patient 2</text>
    <text x="280" y="74" font-size="11" font-family="monospace" font-weight="700" fill="#334155">134</text>
    <text x="530" y="74" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">136</text>

    <!-- Row 3 -->
    <rect x="0" y="82" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="98" font-size="11" font-weight="600" fill="#0f172a">Patient 3</text>
    <text x="280" y="98" font-size="11" font-family="monospace" font-weight="700" fill="#334155">126</text>
    <text x="530" y="98" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">129</text>

    <!-- Row 4 -->
    <rect x="0" y="106" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="122" font-size="11" font-weight="600" fill="#0f172a">Patient 4</text>
    <text x="280" y="122" font-size="11" font-family="monospace" font-weight="700" fill="#334155">140</text>
    <text x="530" y="122" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">142</text>

    <!-- Row 5 -->
    <rect x="0" y="130" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="146" font-size="11" font-weight="600" fill="#0f172a">Patient 5</text>
    <text x="280" y="146" font-size="11" font-family="monospace" font-weight="700" fill="#334155">130</text>
    <text x="530" y="146" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">135</text>

    <!-- Row 6 -->
    <rect x="0" y="154" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="170" font-size="11" font-weight="600" fill="#0f172a">Patient 6</text>
    <text x="280" y="170" font-size="11" font-family="monospace" font-weight="700" fill="#334155">148</text>
    <text x="530" y="170" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">150</text>

    <!-- Row 7 -->
    <rect x="0" y="178" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="194" font-size="11" font-weight="600" fill="#0f172a">Patient 7</text>
    <text x="280" y="194" font-size="11" font-family="monospace" font-weight="700" fill="#334155">122</text>
    <text x="530" y="194" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">128</text>

    <!-- Row 8 -->
    <rect x="0" y="202" width="680" height="24" fill="#ffffff"/>
    <text x="24" y="218" font-size="11" font-weight="600" fill="#0f172a">Patient 8</text>
    <text x="280" y="218" font-size="11" font-family="monospace" font-weight="700" fill="#334155">138</text>
    <text x="530" y="218" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">140</text>

    <!-- Row 9 -->
    <rect x="0" y="226" width="680" height="24" fill="#f8fafc"/>
    <text x="24" y="242" font-size="11" font-weight="600" fill="#0f172a">Patient 9</text>
    <text x="280" y="242" font-size="11" font-family="monospace" font-weight="700" fill="#334155">132</text>
    <text x="530" y="242" font-size="11" font-family="monospace" font-weight="700" fill="#0f766e">136</text>

    <!-- Separator Line -->
    <line x1="0" y1="250" x2="680" y2="250" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Question Prompt Instruction Footer -->
  <rect x="40" y="428" width="680" height="24" fill="#f1f5f9" rx="4"/>
  <text x="50" y="444" font-size="10.5" font-weight="700" fill="#334155">
    REQUIRED: Test whether there is a statistically significant difference at 0.05 and 0.01 levels of significance.
  </text>
</svg>
